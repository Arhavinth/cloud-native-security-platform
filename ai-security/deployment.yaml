apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-security-analyst
  namespace: ai-security
  labels:
    app: ai-security-analyst
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-security-analyst
  template:
    metadata:
      labels:
        app: ai-security-analyst
    spec:
      containers:
        - name: ai-security-analyst
          image: security-platform-registry:5000/ai-security-analyst@sha256:2238238afcb8c34e22d74ed42b3d460cf5d5bf6bdc84285ecf966f6e1dfa449c
          ports:
            - containerPort: 8001
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
