apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-security-analyst
  namespace: ai-security
  labels:
    app: ai-security-analyst
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-security-analyst
  template:
    metadata:
      labels:
        app: ai-security-analyst
    spec:
      containers:
        - name: ai-security-analyst
          image: security-platform-registry:5000/ai-security-analyst@sha256:495903eb3e462897f982f63a746f67a0f587dede64716fc16928d251de09ce0c
          ports:
            - containerPort: 8001
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
