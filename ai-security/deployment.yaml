apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-security-analyst
  namespace: ai-security
  labels:
    app: ai-security-analyst
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-security-analyst
  template:
    metadata:
      labels:
        app: ai-security-analyst
    spec:
      containers:
        - name: ai-security-analyst
          image: security-platform-registry:5000/ai-security-analyst@sha256:dca5b054ce32e8825c648e9ba8c6004fa997dc3ea5090b7de5d8b615984ba1df
          ports:
            - containerPort: 8001
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
