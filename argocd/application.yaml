apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: security-demo-api
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Arhavinth/cloud-native-security-platform.git
    targetRevision: master
    path: kubernetes/base

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true