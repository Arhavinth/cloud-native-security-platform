
name: Security Pipeline

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai-security/requirements.txt

      - name: Install AI Security Analyst test dependencies
        run: |
          python -m pip install -r ai-security/requirements.txt
          python -m pip install pytest

      - name: Run AI Security Analyst regression tests
        run: |
          python -m pytest ai-security/tests -v

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python
        continue-on-error: true

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

      - name: Run Trivy dependency scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: application
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: '0'

      - name: Run Checkov IaC scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/terraform
        continue-on-error: true

      - name: Run Trivy Kubernetes manifest scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: kubernetes
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

      - name: Install Conftest
        run: |
          curl -L https://github.com/open-policy-agent/conftest/releases/download/v0.70.1/conftest_0.70.1_Linux_x86_64.tar.gz \
            -o conftest.tar.gz
          tar -xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin/conftest
          conftest --version

      - name: Run OPA policy checks
        run: |
          conftest test kubernetes/base/deployment.yaml \
            --policy policy/kubernetes

      - name: Build Docker image
        run: |
          docker build \
            -t security-demo-api:${{ github.sha }} \
            ./application

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: security-demo-api:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.json
          artifact-name: security-demo-api-sbom

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: security-demo-api:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: '0'

      - name: Save scanned Docker image
        run: |
          docker save \
            "security-demo-api:${GITHUB_SHA}" \
            -o security-demo-api.tar

      - name: Upload scanned Docker image
        uses: actions/upload-artifact@v4
        with:
          name: security-demo-api-image
          path: security-demo-api.tar
          if-no-files-found: error
          retention-days: 1

  publish-to-ghcr:
    needs: build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Download scanned Docker image
        uses: actions/download-artifact@v4
        with:
          name: security-demo-api-image
          path: .

      - name: Load scanned Docker image
        run: docker load --input security-demo-api.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image to GHCR
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/security-demo-api"
          IMAGE_TAG="${GITHUB_SHA}"

          docker tag \
            "security-demo-api:${IMAGE_TAG}" \
            "${IMAGE_NAME}:${IMAGE_TAG}"

          docker push "${IMAGE_NAME}:${IMAGE_TAG}"
