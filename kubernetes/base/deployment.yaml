apiVersion: apps/v1
kind: Deployment

metadata:
  name: security-demo-api
  labels:
    app: security-demo-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: security-demo-api

  template:
    metadata:
      labels:
        app: security-demo-api

    spec:
      serviceAccountName: security-demo-api

      containers:
        - name: security-demo-api
          image: security-platform-registry:5000/security-demo-api@sha256:0de520e28297027f8c76c2cd7c95a1638dc5756bff9ab50a13b6721cc67f912b

          ports:
            - containerPort: 8080

          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
