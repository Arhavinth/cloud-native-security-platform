apiVersion: apps/v1
kind: Deployment

metadata:
  name: security-demo-api
  labels:
    app: security-demo-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: security-demo-api

  template:
    metadata:
      labels:
        app: security-demo-api

    spec:
      containers:
        - name: security-demo-api
          image: security-platform-registry:5000/security-demo-api@sha256:04a721c3b6bb39a4a6c874ae585a492ddc869006c3f4538ee44f2316325a0a39

          ports:
            - containerPort: 8080

          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"