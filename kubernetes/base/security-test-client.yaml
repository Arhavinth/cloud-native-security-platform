apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-test-client
  namespace: default

---
apiVersion: v1
kind: Pod
metadata:
  name: security-test-client
  namespace: default
  labels:
    app: security-test-client
spec:
  serviceAccountName: security-test-client
  containers:
    - name: curl
      image: curlimages/curl:8.16.0
      command: ["sleep", "3600"]
      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
